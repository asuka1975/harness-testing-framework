scenario: operator_defers
description: 運用者が選択を保留すると escalate 待ちで止まり、選択を得て再開する
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs:
  in.txt: 依頼
visits:
  s1#1:
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify:
      choice: null
      confidence: 0.0
  s2#1:
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: &id001
      choice: goal
      confidence: 0.9
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify: *id001
  s1#2:
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify: *id001
gates:
  p1#1: *id001
  p2#1: *id001
operator:
- kind: defer
- kind: rerun
expect:
  status: completed
  trace:
  - start s1#1
  - eval stage s1 = unknown
  - escalation s1 unknown -> pending
  - end awaiting_operator
  - escalation s1 unknown -> rerun
  - start s1#2
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = goal
  - eval phase p2 = goal
  - gate_pass s3
  - complete
  - end completed
