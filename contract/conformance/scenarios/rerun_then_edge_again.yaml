scenario: rerun_then_edge_again
description: max 超過で再実行を選んだ後に同じ辺を再び踏むと、回数を数え直さずにすぐ escalate する（3.1）
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs: &id004
  in.txt: x
visits:
  s1#1:
    files: &id001
      s1.txt: s1
      s1.flag: 'true'
    classify: &id002
      choice: goal
      confidence: 0.9
  s2#1: &id003
    files:
      s2.txt: s2
      s2.flag: 'false'
      gate1.flag: 'true'
    memory:
      m21: fix
    classify:
      choice: e2_back
      confidence: 0.9
  s1#2:
    files: *id001
    classify: *id002
  s2#2: *id003
  s1#3:
    files: *id001
    classify: *id002
  s2#3: *id003
  s2#4: *id003
operator:
- kind: rerun
- kind: abort
expect:
  status: aborted
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = e2_back
  - rollback s2 -> s1 [e2_back 1]
  - start s1#2
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#2
  - eval stage s2 = e2_back
  - rollback s2 -> s1 [e2_back 2]
  - start s1#3
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#3
  - eval stage s2 = e2_back
  - escalation s2 max_exceeded -> rerun
  - start s2#4
  - eval stage s2 = e2_back
  - escalation s2 max_exceeded -> abort
  - abort
  - end aborted
  starts:
    s1#3:
      files: *id004
      memory:
        m21: fix
      gates: []
    s2#4:
      files:
        in.txt: x
        s1.txt: s1
        s1.flag: 'true'
      memory:
        m21: fix
      gates: []
