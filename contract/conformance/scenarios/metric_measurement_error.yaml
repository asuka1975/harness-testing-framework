scenario: metric_measurement_error
description: ゲートの指標の測定が失敗すると未達として扱い、goal を選択肢から除く
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs:
  in.txt: 依頼
visits:
  s1#1:
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify: &id001
      choice: goal
      confidence: 0.9
  s2#1:
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: *id001
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: 数ではない
    classify:
      choice: goal
      confidence: 0.9
gates:
  p1#1: *id001
  p2#1: *id001
operator:
- kind: abort
expect:
  status: aborted
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = goal
  - eval phase p2 = unknown
  - escalation s3 unknown -> abort
  - abort
  - end aborted
