scenario: suspend_after_rollback
description: 戻った後の s1#2 で中断して再開すると同じ訪問 2 のまま。その後の再実行は訪問 3（3.3、3.4）。保存した回答の再生も確かめる
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs: &id003
  in.txt: x
visits:
  s1#1:
    files: &id001
      s1.txt: s1
      s1.flag: 'true'
    classify: &id002
      choice: goal
      confidence: 0.9
  s2#1:
    files:
      s2.txt: s2
      s2.flag: 'false'
      gate1.flag: 'true'
    memory:
      m21: fix
    classify:
      choice: e2_back
      confidence: 0.9
  s1#2:
    ask:
    - q1
    - q2
    files: *id001
    answers_to: s1.txt
    classify:
      choice: null
      confidence: 0
  s1#3:
    ask:
    - q3
    files: *id001
    answers_to: s1.txt
    classify: *id002
  s2#2:
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: *id002
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify: *id002
gates:
  p1#2: *id002
  p2#1: *id002
user:
- answer: a1
- defer: true
- answer: a2
- answer: a3
operator:
- kind: rerun
expect:
  status: completed
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = e2_back
  - rollback s2 -> s1 [e2_back 1]
  - start s1#2
  - suspend s1
  - end suspended
  - resume s1
  - start s1#2
  - eval stage s1 = unknown
  - escalation s1 unknown -> rerun
  - start s1#3
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#2
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = goal
  - eval phase p2 = goal
  - gate_pass s3
  - complete
  - end completed
  starts:
    s1#2:
      files: *id003
      memory:
        m21: fix
      gates: []
    s1#3:
      files: *id003
      memory:
        m21: fix
      gates: []
    s2#2:
      files:
        in.txt: x
        s1.txt: a3
        s1.flag: 'true'
      memory:
        m21: fix
      gates: []
