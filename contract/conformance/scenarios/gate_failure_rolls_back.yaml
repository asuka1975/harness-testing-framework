scenario: gate_failure_rolls_back
description: p1 のゲートの指標が満たされず、ゲートの分類が最終ステージの e2_back になって s1 へ戻る
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs:
  in.txt: 依頼
visits:
  s1#1: &id001
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify: &id002
      choice: goal
      confidence: 0.9
  s2#1:
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'false'
    classify:
      choice: goal
      confidence: 0.9
    memory:
      m21: gate
  s1#2: *id001
  s2#2:
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: *id002
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify: *id002
gates:
  p1#1:
    choice: e2_back
    confidence: 0.8
  p1#2: *id002
  p2#1: *id002
expect:
  status: completed
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = goal
  - eval phase p1 = e2_back
  - rollback s2 -> s1 [e2_back 1]
  - start s1#2
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#2
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = goal
  - eval phase p2 = goal
  - gate_pass s3
  - complete
  - end completed
  memory:
    m21: gate
  starts:
    s1#2:
      files:
        in.txt: 依頼
      memory:
        m21: gate
      gates: []
    s3#1:
      files:
        in.txt: 依頼
        s1.txt: s1
        s1.flag: 'true'
        s2.txt: s2
        s2.flag: 'true'
        gate1.flag: 'true'
      memory:
        m21: gate
      gates:
      - p1
  options:
    stage:s2#1:
    - goal
    - e2_back
    - unknown
    phase:p1#1:
    - e2_back
    - unknown
