scenario: low_confidence_operator_rollback
description: 確信度が閾値未満で unknown になり、運用者が carry つきで s2 へ戻す（unknown、運用者のロールバック）
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs:
  in.txt: 依頼
visits:
  s1#1:
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify: &id001
      choice: goal
      confidence: 0.9
  s2#1: &id002
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: *id001
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify:
      choice: e3_retry
      confidence: 0.3
    memory:
      m32: x
  s2#2: *id002
  s3#2:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify: *id001
gates:
  p1#1: *id001
  p1#2: *id001
  p2#2: *id001
operator:
- kind: rollback
  stage: s2
  carry:
  - m32
expect:
  status: completed
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = unknown
  - escalation s3 unknown -> rollback
  - rollback s3 -> s2 [operator] crossing
  - start s2#2
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#2
  - eval stage s3 = goal
  - eval phase p2 = goal
  - gate_pass s3
  - complete
  - end completed
  memory:
    m32: x
