scenario: review_and_outline_rollbacks
description: 査読の指摘で write_note へ戻り、次に書けない節が見つかってフェーズ境界を越えて plan_outline へ戻り、intake のゲートを評価し直す（rollback、フェーズ境界越え）
workflow: ../../workflow.yaml
seed: 7
inputs:
  brief.txt: 新入社員向けに、勉強会の議事録の書き方を短いノートにまとめてほしい。
visits:
  ask_topic#1:
    fixture: ask_topic/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  plan_outline#1: &id002
    fixture: plan_outline/ok
    classify: *id001
  write_note#1: &id003
    fixture: write_note/ok
    classify: *id001
  review_note#1:
    fixture: review_note/blocking
    memory:
      review_findings:
      - 例が新入社員には抽象的すぎる
    classify:
      choice: findings_blocking
      confidence: 0.9
  write_note#2:
    fixture: write_note/gaps
    memory:
      outline_gaps:
      - '例: 読者に照らして範囲外'
    classify:
      choice: outline_unfit
      confidence: 0.9
  plan_outline#2: *id002
  write_note#3: *id003
  review_note#2:
    fixture: review_note/ok
    classify: *id001
gates:
  intake#1: *id001
  intake#2: *id001
  compose#2: *id001
expect:
  status: completed
  trace:
  - start ask_topic#1
  - eval stage ask_topic = goal
  - next ask_topic -> plan_outline
  - start plan_outline#1
  - eval stage plan_outline = goal
  - eval phase intake = goal
  - gate_pass plan_outline
  - next plan_outline -> write_note
  - start write_note#1
  - eval stage write_note = goal
  - next write_note -> review_note
  - start review_note#1
  - eval stage review_note = findings_blocking
  - rollback review_note -> write_note [findings_blocking 1]
  - start write_note#2
  - eval stage write_note = outline_unfit
  - rollback write_note -> plan_outline [outline_unfit 1] crossing
  - start plan_outline#2
  - eval stage plan_outline = goal
  - eval phase intake = goal
  - gate_pass plan_outline
  - next plan_outline -> write_note
  - start write_note#3
  - eval stage write_note = goal
  - next write_note -> review_note
  - start review_note#2
  - eval stage review_note = goal
  - eval phase compose = goal
  - gate_pass review_note
  - complete
  - end completed
  memory:
    outline_gaps:
    - '例: 読者に照らして範囲外'
