# 保護ファイル。markov.yaml の各基準を設計値から外れるようにずらしたもの。どの基準も落ちなければならない
expectations: toy-markov-shifted
description: markov の各基準をずらしたもの（分布テストが誤った基準を落とすことの確認）
workflow: ../../workflow.yaml
runs: 200
seed: 10000
bindings: {profile: markov}
criteria:
  - {kind: outcome_rate, target: ask_topic, visit: 1, outcome: unknown, min: 0.20, max: 0.40}
  - {kind: outcome_rate, target: plan_outline, visit: 1, outcome: topic_unclear, min: 0.45, max: 0.65}
  - {kind: outcome_rate, target: write_note, visit: 1, outcome: goal, min: 0.92, max: 1.0}
  - {kind: outcome_rate, target: review_note, visit: 1, outcome: findings_blocking, min: 0.45, max: 0.65}
  - {kind: outcome_rate, target: review_note, from_visit: 2, outcome: findings_blocking, min: 0.30, max: 0.50}
