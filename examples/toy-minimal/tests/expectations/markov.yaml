# 保護ファイル（plan.md 第5.9節）。基準は tests/stochastic.yaml の markov の設計値から手で導いた。
# 各基準の幅は、設計値の両側に、既定の実行回数（200）での標準誤差のおよそ 3 倍をとった
expectations: toy-markov
description: markov の確率的な偽ステージ本体での、評価の結果の出現率
workflow: ../../workflow.yaml
runs: 200
seed: 10000
bindings: {profile: markov}
criteria:
  - kind: outcome_rate
    target: ask_topic
    visit: 1
    outcome: unknown
    min: 0.0
    max: 0.12            # 設計値 0.05
  - kind: outcome_rate
    target: plan_outline
    visit: 1
    outcome: topic_unclear
    min: 0.15
    max: 0.35            # 設計値 0.25
  - kind: outcome_rate
    target: write_note
    visit: 1
    outcome: goal
    min: 0.70
    max: 0.90            # 設計値 0.80（ok と ok_b の和）
  - kind: outcome_rate
    target: review_note
    visit: 1
    outcome: findings_blocking
    min: 0.20
    max: 0.40            # 設計値 0.30
  - kind: outcome_rate
    target: review_note
    from_visit: 2
    outcome: findings_blocking
    min: 0.0
    max: 0.22            # 設計値 0.10
