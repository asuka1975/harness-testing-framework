scenario: release_unknown_operator_rollback
description: release の成果物の版が上がっておらず（実在の指標で goal が選択肢から外れる）、分類器が答えず unknown になる。運用者は記憶 review_findings
  を持たせて implement へ戻す（運用者のロールバック、フェーズ境界越え）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id009
    from: ../fixtures/inputs/feature_request.md
  repo/: &id010
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id011 []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: &id012 []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: &id013 []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: &id002 []
      impl_violations: &id003 []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: &id004 []
      coverage_gaps: &id005 []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: &id006 []
      requirement_gaps: &id007 []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings: &id014
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/unknown
    classify:
      choice: null
      confidence: 0.0
    memory:
      missing_notes: &id008 []
  implement#2:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: *id002
      impl_violations: *id003
  unit_test#2:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: *id004
      coverage_gaps: *id005
  acceptance#2:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: *id006
      requirement_gaps: *id007
  review#2:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#2:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: *id008
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1: *id001
  construction#2: *id001
  assurance#2: *id001
  delivery#2: *id001
operator:
- kind: rollback
  stage: implement
  carry:
  - review_findings
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = unknown
  - escalation release unknown -> rollback
  - rollback release -> implement [operator] crossing
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#2
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#2
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#2
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#2
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    implement#2:
      files:
        feature_request.md: *id009
        repo/: *id010
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
        tasks.yaml:
          from: ../fixtures/plan_tasks/ok/tasks.yaml
      memory:
        intake_questions: *id011
        requirement_gaps: *id012
        design_issues: *id013
        review_findings: *id014
      gates:
      - discovery
      - architecture
  options:
    stage:release#1:
    - notes_incomplete
    - unknown
  memory:
    review_findings: *id014
    design_issues: []
