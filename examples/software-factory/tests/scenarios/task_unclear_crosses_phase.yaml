scenario: task_unclear_crosses_phase
description: implement がタスクの曖昧さを記憶 task_questions に書き、construction から architecture の plan_tasks に戻る。architecture
  のゲートを評価し直す。実在の指標はすべて通るが、記述の優先（goal に優先）で task_unclear に分類される（フェーズ境界越え）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id004
    from: ../fixtures/inputs/feature_request.md
  repo/: &id005
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id006 []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: &id007 []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: &id002 []
  implement#1:
    fixture: implement/unclear
    memory:
      task_questions: &id008
      - 'T2: 割引を小計に適用するのか、商品ごとに適用するのかが tasks.yaml から決められない'
      impl_violations: &id003 []
    classify:
      choice: task_unclear
      confidence: 0.9
  plan_tasks#2:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: *id002
  implement#2:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: []
      impl_violations: *id003
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: []
      coverage_gaps: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  architecture#2: *id001
  construction#1: *id001
  assurance#1: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = task_unclear
  - rollback implement -> plan_tasks [task_unclear 1] crossing
  - start plan_tasks#2
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    plan_tasks#2:
      files:
        feature_request.md: *id004
        repo/: *id005
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
      memory:
        intake_questions: *id006
        requirement_gaps: *id007
        task_questions: *id008
      gates:
      - discovery
  options:
    stage:implement#1:
    - goal
    - task_unclear
    - quality_violation
    - unknown
