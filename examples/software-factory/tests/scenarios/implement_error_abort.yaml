scenario: implement_error_abort
description: implement の本体が例外で終わり、評価をせずに escalate する。運用者が中止を選ぶ（unknown（本体の例外）、中止）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md:
    from: ../fixtures/inputs/feature_request.md
  repo/:
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
  design#1:
    fixture: design/ok
    classify: *id001
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
  implement#1:
    raise: stage_error
gates:
  discovery#1: *id001
  architecture#1: *id001
operator:
- kind: abort
expect:
  status: aborted
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - error implement#1 stage_error
  - escalation implement stage_error -> abort
  - abort
  - end aborted
