scenario: acceptance_unmet_crosses_phase
description: acceptance が REQ-1 の不合格を見つけ、記憶 unmet_requirements を持って assurance から construction の implement
  に戻る。construction のゲートを評価し直し、単体テストもやり直す（フェーズ境界越え、ゲートの再評価、実在の指標による再評価）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id007
    from: ../fixtures/inputs/feature_request.md
  repo/: &id008
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id009 []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: &id010 []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: &id011 []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: &id002 []
      impl_violations: &id003 []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: &id004 []
      coverage_gaps: &id005 []
      test_defects: &id006 []
  acceptance#1:
    fixture: acceptance/unmet
    memory:
      unmet_requirements: &id012
      - 'REQ-1: 小計 333 円に PCT10 を適用すると支払額が 299 円になる（割引額の 1 円未満を切り捨てれば 300 円）。repo/src/shopcart/discount.py
        の Discount.apply が支払額を切り捨てている'
      requirement_gaps: []
    classify:
      choice: requirement_unmet
      confidence: 0.9
  implement#2:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: *id002
      impl_violations: *id003
  unit_test#2:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: *id004
      coverage_gaps: *id005
      test_defects: *id006
  acceptance#2:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  construction#2: *id001
  assurance#1: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = requirement_unmet
  - rollback acceptance -> implement [requirement_unmet 1] crossing
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#2
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#2
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    implement#2:
      files:
        feature_request.md: *id007
        repo/: *id008
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
        tasks.yaml:
          from: ../fixtures/plan_tasks/ok/tasks.yaml
      memory:
        intake_questions: *id009
        requirement_gaps: *id010
        design_issues: *id011
        unmet_requirements: *id012
      gates:
      - discovery
      - architecture
  memory:
    unmet_requirements: []
