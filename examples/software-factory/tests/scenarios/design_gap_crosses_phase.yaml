scenario: design_gap_crosses_phase
description: design が要件の曖昧さを見つけ、記憶 requirement_gaps を持ってフェーズ境界を越えて analyze に戻る。discovery のゲートは未通過に戻り、analyze
  が再び goal に達した時に評価し直す（フェーズ境界越え、ゲートの再評価）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id003
    from: ../fixtures/inputs/feature_request.md
  repo/: &id004
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id002 []
  design#1:
    fixture: design/gap
    memory:
      requirement_gaps: &id005
      - 'REQ-3 と REQ-4: コードを Cart のどの操作で受け取るかが決まっていない'
    classify:
      choice: requirements_gap
      confidence: 0.9
  analyze#2:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: *id002
  design#2:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: []
      impl_violations: []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: []
      coverage_gaps: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  discovery#2: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = requirements_gap
  - rollback design -> analyze [requirements_gap 1] crossing
  - start analyze#2
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#2
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    analyze#2:
      files:
        feature_request.md: *id003
        repo/: *id004
        intake.md:
          from: ../fixtures/intake/ok/intake.md
      memory:
        requirement_gaps: *id005
      gates: []
  memory:
    requirement_gaps: []
