scenario: review_design_flaw_crosses_phases
description: review が設計を直さなければ解消しない指摘を見つけ、記憶 design_issues を持って assurance から architecture の design に戻る。architecture、construction、assurance
  のゲートを評価し直す（フェーズ境界越え）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id007
    from: ../fixtures/inputs/feature_request.md
  repo/: &id008
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
  design#1: &id002
    fixture: design/ok
    classify: *id001
  plan_tasks#1: &id003
    fixture: plan_tasks/ok
    classify: *id001
  implement#1: &id004
    fixture: implement/ok
    classify: *id001
  unit_test#1: &id005
    fixture: unit_test/ok
    classify: *id001
  acceptance#1: &id006
    fixture: acceptance/ok
    classify: *id001
  review#1:
    fixture: review/design_flaw
    memory:
      design_issues: &id009
      - 割引の種類を Discount の分岐で表しており、種類を足すたびに apply を直すことになる
      review_findings: []
    classify:
      choice: design_flaw
      confidence: 0.9
  design#2: *id002
  plan_tasks#2: *id003
  implement#2: *id004
  unit_test#2: *id005
  acceptance#2: *id006
  review#2:
    fixture: review/ok
    classify: *id001
  release#1:
    fixture: release/ok
    classify: *id001
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  architecture#2: *id001
  construction#2: *id001
  assurance#2: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = design_flaw
  - rollback review -> design [design_flaw 1] crossing
  - start design#2
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#2
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#2
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#2
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#2
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    design#2:
      files:
        feature_request.md: *id007
        repo/: *id008
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
      memory:
        design_issues: *id009
      gates:
      - discovery
  memory:
    design_issues: *id009
