scenario: assurance_gate_rolls_back
description: review は goal に達するが、assurance のゲートの分類が、修正を要しない指摘と verification.md を合わせて changes_requested
  （review の end_state のフェーズ全体の条件）を選び、goal の時に書いた review_findings を持って implement に戻る（ゲートからの rollback）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: |
    # 依頼: 買い物かごに割引コードを入れたい

    shopcart ライブラリの Cart に、割引コードを適用した支払額を出す機能を足してほしい。
    来月のキャンペーンで「10% 引き」と「500 円引き」のコードを配る予定。
  repo/src/shopcart/__init__.py: |
    """小さな買い物かごのライブラリ。"""

    __version__ = "0.1.0"
  repo/src/shopcart/cart.py: |
    """買い物かご。金額は円の整数。"""


    class Cart:
        def __init__(self) -> None:
            self.items: dict[str, tuple[int, int]] = {}

        def add(self, sku: str, price: int, qty: int = 1) -> None:
            if qty <= 0:
                raise ValueError("qty must be positive")
            _, held = self.items.get(sku, (price, 0))
            self.items[sku] = (price, held + qty)

        def remove(self, sku: str) -> None:
            self.items.pop(sku, None)

        def subtotal(self) -> int:
            return sum(price * qty for price, qty in self.items.values())
  repo/tests/test_cart.py: |
    import pytest
    from shopcart.cart import Cart


    def test_subtotal_sums_price_times_quantity() -> None:
        cart = Cart()
        cart.add("apple", 120, 2)
        cart.add("pear", 200)
        assert cart.subtotal() == 440


    def test_remove_drops_the_item() -> None:
        cart = Cart()
        cart.add("apple", 120)
        cart.add("apple", 120)
        cart.remove("apple")
        assert cart.subtotal() == 0


    def test_add_rejects_nonpositive_quantity() -> None:
        with pytest.raises(ValueError):
            Cart().add("apple", 120, 0)
