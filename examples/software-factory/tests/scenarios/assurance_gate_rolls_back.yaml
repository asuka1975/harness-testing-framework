scenario: assurance_gate_rolls_back
description: review は goal に達するが、assurance のゲートの分類が、修正を要しない指摘と verification.md を合わせて changes_requested
  （review の end_state のフェーズ全体の条件）を選び、goal の時に書いた review_findings を持って implement に戻る（ゲートからの rollback）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md:
    from: ../fixtures/inputs/feature_request.md
  repo/:
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: &id002 []
      impl_violations: &id003 []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: &id004 []
      coverage_gaps: &id005 []
      test_defects: &id006 []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: &id007 []
      requirement_gaps: &id008 []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings: &id009
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  implement#2:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: *id002
      impl_violations: *id003
  unit_test#2:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: *id004
      coverage_gaps: *id005
      test_defects: *id006
  acceptance#2:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: *id007
      requirement_gaps: *id008
  review#2:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1:
    choice: changes_requested
    confidence: 0.9
  construction#2: *id001
  assurance#2: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = changes_requested
  - rollback review -> implement [changes_requested 1] crossing
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#2
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#2
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#2
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  options:
    phase:assurance#1:
    - goal
    - design_flaw
    - changes_requested
    - unknown
  memory:
    review_findings: *id009
