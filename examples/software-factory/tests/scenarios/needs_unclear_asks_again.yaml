scenario: needs_unclear_asks_again
description: analyze が intake.md の回答から要件を決められず、問いを記憶 intake_questions に書いて intake に戻る。intake は持ち帰った問いを依頼者に尋ね、analyze
  が要件を決める（rollback と carry、ユーザー回答待ちのステージへの戻り）
workflow: ../../workflow.yaml
seed: 11
inputs: &id003
  feature_request.md:
    from: ../fixtures/inputs/feature_request.md
  repo/:
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/unclear
    memory:
      intake_questions: &id002
      - キャンペーンが終わった後も、割引コードを使えるようにしますか
      - 同じ購入者が同じコードを何回でも使えるようにしますか
    classify:
      choice: needs_unclear
      confidence: 0.9
  intake#2:
    fixture: intake/ok
    classify: *id001
    ask: *id002
  analyze#2:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: []
      impl_violations: []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: []
      coverage_gaps: []
      test_defects: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#2: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1: *id001
  delivery#1: *id001
user:
- answer: キャンペーンの結果を見て、来月の末に決める
- answer: 回数の制限は、法務と相談してから決める
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = needs_unclear
  - rollback analyze -> intake [needs_unclear 1]
  - start intake#2
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#2
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    intake#2:
      files: *id003
      memory:
        intake_questions: *id002
      gates: []
  memory:
    intake_questions: []
