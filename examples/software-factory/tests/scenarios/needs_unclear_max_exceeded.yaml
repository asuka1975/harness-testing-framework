scenario: needs_unclear_max_exceeded
description: analyze の needs_unclear が三回続いて辺の max（2）を超え、運用者が goal 到達扱いで続行する。analyze は discovery の最終ステージなのでゲートを評価し、三つの要件のまま後のフェーズの実在の指標を通る（max
  超過、goal 到達扱い）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md:
    from: ../fixtures/inputs/feature_request.md
  repo/:
    from: ../fixtures/inputs/repo/
visits:
  intake#1: &id001
    fixture: intake/ok
    classify: &id004
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/unclear
    memory:
      intake_questions: &id002
      - キャンペーンが終わった後も、割引コードを使えるようにしますか
      - 同じ購入者が同じコードを何回でも使えるようにしますか
    classify: &id003
      choice: needs_unclear
      confidence: 0.9
  intake#2: *id001
  analyze#2:
    fixture: analyze/unclear
    memory:
      intake_questions: *id002
    classify: *id003
  intake#3: *id001
  analyze#3:
    fixture: analyze/unclear
    memory:
      intake_questions: *id002
    classify: *id003
  design#1:
    fixture: design/ok
    classify: *id004
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id004
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id004
    memory:
      task_questions: []
      impl_violations: []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id004
    memory:
      failing_tests: []
      coverage_gaps: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id004
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id004
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id004
    memory:
      missing_notes: []
gates:
  discovery#3: *id004
  architecture#1: *id004
  construction#1: *id004
  assurance#1: *id004
  delivery#1: *id004
operator:
- kind: continue_as_goal
  note: 未決事項は次の版で決める
  by: プロダクトオーナー
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = needs_unclear
  - rollback analyze -> intake [needs_unclear 1]
  - start intake#2
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#2
  - eval stage analyze = needs_unclear
  - rollback analyze -> intake [needs_unclear 2]
  - start intake#3
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#3
  - eval stage analyze = needs_unclear
  - escalation analyze max_exceeded -> continue_as_goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  annotations: 1
