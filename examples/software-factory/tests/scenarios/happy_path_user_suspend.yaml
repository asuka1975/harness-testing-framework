scenario: happy_path_user_suspend
description: intake が依頼者に三つ尋ね、二つ目の回答の保留で中断し、回答を得て再開する（一つ目の回答は再生する）。その後は全ステージが一回で goal に達し、5 つのゲートを通って完了する（next、中断と再開）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md:
    from: ../fixtures/inputs/feature_request.md
  repo/:
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
    ask:
    - この機能を使うのは誰ですか
    - 配る割引コードの種類と上限は何ですか
    - 使えないコードが入力された時はどうしますか
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: []
      impl_violations: []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: []
      coverage_gaps: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1: *id001
  delivery#1: *id001
user:
- answer: ネットショップの購入者。レジの画面でコードを入力する
- defer: true
- answer: PCT10 のような百分率のコードと、OFF500 のような定額のコード。百分率は 50% まで
- answer: エラーにして、割引しない
expect:
  status: completed
  trace:
  - start intake#1
  - suspend intake
  - end suspended
  - resume intake
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
