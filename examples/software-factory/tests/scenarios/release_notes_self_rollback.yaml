scenario: release_notes_self_rollback
description: release の CHANGELOG.md に REQ-3 が無く（実在の指標で goal が選択肢から外れる）、記憶 missing_notes を持って自分自身に戻る。二回目の
  release は持ち帰った記憶を受けて書き直す（自分自身への rollback と carry）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id002
    from: ../fixtures/inputs/feature_request.md
  repo/: &id003
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id004 []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: &id007 []
      impl_violations: &id008 []
  unit_test#1:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: &id009 []
      coverage_gaps: &id010 []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: &id011 []
      requirement_gaps: &id005 []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings: &id012
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: &id006 []
  release#1:
    fixture: release/incomplete
    memory:
      missing_notes: &id013
      - REQ-3
    classify:
      choice: notes_incomplete
      confidence: 0.9
  release#2:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#1: *id001
  assurance#1: *id001
  delivery#2: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = notes_incomplete
  - rollback release -> release [notes_incomplete 1]
  - start release#2
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    release#2:
      files:
        feature_request.md: *id002
        repo/: *id003
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
        tasks.yaml:
          from: ../fixtures/plan_tasks/ok/tasks.yaml
        impl_notes.md:
          from: ../fixtures/implement/ok/impl_notes.md
        repo/src/shopcart/cart.py:
          from: ../fixtures/implement/ok/repo/src/shopcart/cart.py
        repo/src/shopcart/discount.py:
          from: ../fixtures/implement/ok/repo/src/shopcart/discount.py
        repo/tests/test_discount.py:
          from: ../fixtures/unit_test/ok/repo/tests/test_discount.py
        test_report.md:
          from: ../fixtures/unit_test/ok/test_report.md
        verification.md:
          from: ../fixtures/acceptance/ok/verification.md
        review.json:
          from: ../fixtures/review/ok/review.json
      memory:
        intake_questions: *id004
        requirement_gaps: *id005
        design_issues: *id006
        task_questions: *id007
        impl_violations: *id008
        failing_tests: *id009
        coverage_gaps: *id010
        unmet_requirements: *id011
        review_findings: *id012
        missing_notes: *id013
      gates:
      - discovery
      - architecture
      - construction
      - assurance
  options:
    stage:release#1:
    - notes_incomplete
    - unknown
    stage:release#2:
    - goal
    - notes_incomplete
    - unknown
  memory:
    missing_notes: []
