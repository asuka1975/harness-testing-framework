scenario: construction_rollbacks
description: implement の lint 違反（実在の ruff）で自分自身に戻り、unit_test のカバレッジ不足（実在の coverage）で自分自身に戻り、unit_test
  のテストの失敗（実在の pytest）で implement に戻る。直した実装で同じテストが通る（rollback、自分自身への rollback、carry の積み重ね）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id002
    from: ../fixtures/inputs/feature_request.md
  repo/: &id003
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
  design#1:
    fixture: design/ok
    classify: *id001
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
  implement#1:
    fixture: implement/lint
    memory:
      impl_violations: &id004
      - 'lint: repo/src/shopcart/discount.py に使っていない import と長すぎる行がある'
    classify:
      choice: quality_violation
      confidence: 0.9
  implement#2:
    fixture: implement/ok
    classify: *id001
  unit_test#1:
    fixture: unit_test/thin
    memory:
      coverage_gaps:
      - REQ-1、REQ-2、REQ-3 の受け入れ基準にテストが無い
      failing_tests: []
    classify:
      choice: tests_insufficient
      confidence: 0.9
  unit_test#2:
    fixture: unit_test/defect_found
    memory:
      failing_tests: &id006
      - 'test_percent_discount_rounds_the_discount_down: 333 円の PCT10 が 299 円になる（期待 300 円）'
      coverage_gaps: []
    classify:
      choice: impl_defect
      confidence: 0.9
  implement#3:
    fixture: implement/ok_fixed
    classify: *id001
  unit_test#3:
    fixture: unit_test/defect_passed
    classify: *id001
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
  review#1:
    fixture: review/ok
    classify: *id001
  release#1:
    fixture: release/ok
    classify: *id001
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#3: *id001
  assurance#1: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = quality_violation
  - rollback implement -> implement [quality_violation 1]
  - start implement#2
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = tests_insufficient
  - rollback unit_test -> unit_test [tests_insufficient 1]
  - start unit_test#2
  - eval stage unit_test = impl_defect
  - rollback unit_test -> implement [impl_defect 1]
  - start implement#3
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#3
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    implement#2:
      files: &id005
        feature_request.md: *id002
        repo/: *id003
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
        tasks.yaml:
          from: ../fixtures/plan_tasks/ok/tasks.yaml
      memory:
        impl_violations: *id004
      gates:
      - discovery
      - architecture
    implement#3:
      files: *id005
      memory:
        impl_violations: *id004
        failing_tests: *id006
      gates:
      - discovery
      - architecture
  memory:
    failing_tests: *id006
