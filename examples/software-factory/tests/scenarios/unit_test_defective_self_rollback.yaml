scenario: unit_test_defective_self_rollback
description: unit_test が、要件に反する期待のテスト（小計 300 円に OFF500 で -200 円を期待する。実在の pytest で落ちる）を、直すべき不備として記憶 coverage_gaps
  と test_report.md の「## 未網羅」に書き、自分自身に戻る（tests_insufficient。テストは落ちるが期待が要件に反するので impl_defect ではない）。二回目の
  unit_test は持ち帰った coverage_gaps を受けて書き直す（自分自身への rollback と carry。実在の指標で goal が選択肢から外れる）
workflow: ../../workflow.yaml
seed: 11
inputs:
  feature_request.md: &id002
    from: ../fixtures/inputs/feature_request.md
  repo/: &id003
    from: ../fixtures/inputs/repo/
visits:
  intake#1:
    fixture: intake/ok
    classify: &id001
      choice: goal
      confidence: 0.9
  analyze#1:
    fixture: analyze/ok
    classify: *id001
    memory:
      intake_questions: &id004 []
  design#1:
    fixture: design/ok
    classify: *id001
    memory:
      requirement_gaps: &id005 []
  plan_tasks#1:
    fixture: plan_tasks/ok
    classify: *id001
    memory:
      design_issues: &id006 []
  implement#1:
    fixture: implement/ok
    classify: *id001
    memory:
      task_questions: &id007 []
      impl_violations: &id008 []
  unit_test#1:
    fixture: unit_test/defective
    memory:
      failing_tests: []
      coverage_gaps: &id009
      - 'repo/tests/test_discount.py の test_amount_code_subtracts_the_whole_amount: 小計 300 円に OFF500 で
        -200 円を期待しているが、REQ-2 は支払額が 0 円を下回らない（受け入れ基準は 0 円）。期待が要件に反するので、このテストは落ちる'
    classify:
      choice: tests_insufficient
      confidence: 0.9
  unit_test#2:
    fixture: unit_test/ok
    classify: *id001
    memory:
      failing_tests: []
      coverage_gaps: []
  acceptance#1:
    fixture: acceptance/ok
    classify: *id001
    memory:
      unmet_requirements: []
      requirement_gaps: []
  review#1:
    fixture: review/ok
    classify: *id001
    memory:
      review_findings:
      - （修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい
      design_issues: []
  release#1:
    fixture: release/ok
    classify: *id001
    memory:
      missing_notes: []
gates:
  discovery#1: *id001
  architecture#1: *id001
  construction#2: *id001
  assurance#1: *id001
  delivery#1: *id001
expect:
  status: completed
  trace:
  - start intake#1
  - eval stage intake = goal
  - next intake -> analyze
  - start analyze#1
  - eval stage analyze = goal
  - eval phase discovery = goal
  - gate_pass analyze
  - next analyze -> design
  - start design#1
  - eval stage design = goal
  - next design -> plan_tasks
  - start plan_tasks#1
  - eval stage plan_tasks = goal
  - eval phase architecture = goal
  - gate_pass plan_tasks
  - next plan_tasks -> implement
  - start implement#1
  - eval stage implement = goal
  - next implement -> unit_test
  - start unit_test#1
  - eval stage unit_test = tests_insufficient
  - rollback unit_test -> unit_test [tests_insufficient 1]
  - start unit_test#2
  - eval stage unit_test = goal
  - eval phase construction = goal
  - gate_pass unit_test
  - next unit_test -> acceptance
  - start acceptance#1
  - eval stage acceptance = goal
  - next acceptance -> review
  - start review#1
  - eval stage review = goal
  - eval phase assurance = goal
  - gate_pass review
  - next review -> release
  - start release#1
  - eval stage release = goal
  - eval phase delivery = goal
  - gate_pass release
  - complete
  - end completed
  starts:
    unit_test#2:
      files:
        feature_request.md: *id002
        repo/: *id003
        intake.md:
          from: ../fixtures/intake/ok/intake.md
        requirements.md:
          from: ../fixtures/analyze/ok/requirements.md
        design.md:
          from: ../fixtures/design/ok/design.md
        tasks.yaml:
          from: ../fixtures/plan_tasks/ok/tasks.yaml
        impl_notes.md:
          from: ../fixtures/implement/ok/impl_notes.md
        repo/src/shopcart/cart.py:
          from: ../fixtures/implement/ok/repo/src/shopcart/cart.py
        repo/src/shopcart/discount.py:
          from: ../fixtures/implement/ok/repo/src/shopcart/discount.py
      memory:
        intake_questions: *id004
        requirement_gaps: *id005
        design_issues: *id006
        task_questions: *id007
        impl_violations: *id008
        coverage_gaps: *id009
      gates:
      - discovery
      - architecture
  options:
    stage:unit_test#1:
    - impl_defect
    - tests_insufficient
    - unknown
    stage:unit_test#2:
    - goal
    - impl_defect
    - tests_insufficient
    - unknown
  memory:
    coverage_gaps: []
    failing_tests: []
