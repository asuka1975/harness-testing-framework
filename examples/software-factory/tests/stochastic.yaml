# software-factory の確率的な偽ステージ本体の設計値。
#
# 本体は訪問ごとに、文脈の種（context.seed）だけを乱数の源にして変種を一つ選び、フィクスチャ
# （tests/fixtures/<ステージ>/<変種>/）を作業領域に写し、変種の記憶を書く。成果物の先頭の印
# [[class <ステージ>=<クラス>]] を MarkerClassifier が読む。memory_out の記憶は、どの変種も訪問のたびにすべて書く（問題が
# 無ければ空の一覧。adopting.md 第2.1節。test_stochastic.py が確かめる）。
#
# 分布の鍵（condition）:
# - first / again: 訪問 1 / 訪問 2 以降の分布
# - release だけは訪問の回数ではなく、carry を受けたか（記憶 missing_notes が空でない一覧か）で分布を選ぶ
#   （without_carry / with_carry）。release に戻る辺は自分自身への notes_incomplete だけで、release は最後のステージなので、
#   運用者が中止で答える実行では「訪問 2 以降」と「carry を受けた」が一致する（test_stochastic.py が確かめる）
#
# metrics_fail は、その変種の成果物（上流は goal の変種）に実在の指標をかけた時に落ちる、ステージの goal の指標
# （test_metrics.py が確かめる）。goal の変種は全部通る。
#
# variants には、分布テストの分布（markov、divergent）に置かない変種もある（unit_test の defective）。確率的な実行には
# 現れず、シナリオと、人がラベルを付ける材料の試しの実行（profiles の labeling）が写す。
#
# 分布テスト（expectations）、独立性検証、マルコフ合成の期待は、この表から導く。

families:
  # 単体テストの変種 defect のクラスは、repo/src/shopcart/discount.py がどの実装の変種かで決まる。
  # ok と ok_b は REQ-1 の割引額の切り捨てを誤る（支払額を切り捨てる）。ok_fixed は正しい
  ok: rounds_total
  ok_b: rounds_total
  ok_fixed: correct

variants:
  intake:
    ok: {class: goal}
    unknown: {class: unknown}
  analyze:
    ok: {class: goal, memory: {intake_questions: []}}
    unclear:
      class: needs_unclear
      memory:
        intake_questions: [キャンペーンが終わった後も、割引コードを使えるようにしますか, 同じ購入者が同じコードを何回でも使えるようにしますか]
    unknown:
      class: unknown
      memory: {intake_questions: []}
      metrics_fail: [requirement_count, requirements_with_criteria]
  design:
    ok: {class: goal, memory: {requirement_gaps: []}}
    gap:
      class: requirements_gap
      memory: {requirement_gaps: ["REQ-3 と REQ-4: コードを Cart のどの操作で受け取るかが決まっていない"]}
      metrics_fail: [design_covers_requirements]
    unknown: {class: unknown, memory: {requirement_gaps: []}, metrics_fail: [design_covers_requirements]}
  plan_tasks:
    # design_incomplete の変種は置かない（往復 10 の人間の回答で、この形のまま残すと決まった）。クラスは種だけで選ぶので、
    # 代表は組みうるすべての上流の成果物と整合しなければならない。plan_tasks は design の goal の後に走り、design の goal の
    # 代表の design.md はすべての要件を構成のファイルに割り当てている。記述の上では、design の goal を正しく満たした後でも、
    # implement が「paths の外のファイルを変えないと実装できない」と問いを持ち帰り、そのファイルが design.md の「## 構成」に
    # 無いと分かる経路で design_incomplete は起きうる。しかし plan_tasks の訪問の多く（訪問 1 と、design から next で入り直した
    # 訪問）はそういう問いを持たず、この例の implement の task_unclear の代表の問いも割引の適用の単位で、paths の外のファイル
    # ではない。そのため、どの上流と組んでも記述どおりになる代表は作れない。design_incomplete は E2E のカバレッジで注入して
    # 踏み、シナリオ plan_tasks_design_incomplete_rollback が持ち帰る記憶を確かめる（README の「人間のレビューの回答」）
    ok: {class: goal, memory: {design_issues: []}}
    unknown: {class: unknown, memory: {design_issues: []}}
  implement:
    ok: {class: goal, memory: {task_questions: [], impl_violations: []}}
    ok_b: {class: goal, memory: {task_questions: [], impl_violations: []}}
    ok_fixed: {class: goal, memory: {task_questions: [], impl_violations: []}}
    lint:
      class: quality_violation
      memory: {task_questions: [], impl_violations: ["lint: discount.py に使っていない import と長すぎる行がある"]}
      metrics_fail: [lint_errors]
    scope:
      class: quality_violation
      memory: {task_questions: [], impl_violations: ["範囲: repo/src/shopcart/utils.py はどのタスクの paths にも無い"]}
      metrics_fail: [out_of_scope_changes]
    broken:
      class: quality_violation
      memory: {task_questions: [], impl_violations: ["ビルド: discount.py の parse_code の定義に構文の誤りがある"]}
      metrics_fail: [build_passes, tests_pass, lint_errors]
    unclear:
      class: task_unclear
      memory:
        task_questions: ["T2: 割引を小計に適用するのか、商品ごとに適用するのかが tasks.yaml から決められない"]
        impl_violations: []
    unknown: {class: unknown, memory: {task_questions: [], impl_violations: []}}
  unit_test:
    ok: {class: goal, memory: {failing_tests: [], coverage_gaps: []}}
    thin:
      class: tests_insufficient
      memory: {failing_tests: [], coverage_gaps: [REQ-1、REQ-2、REQ-3 の受け入れ基準にテストが無い]}
      metrics_fail: [line_coverage]
    defect:
      # 実装の系統（families）ごとに、写すフィクスチャとクラスが分かれる
      by_family:
        rounds_total:
          fixture: defect_found
          class: impl_defect
          memory:
            failing_tests: ["test_percent_discount_rounds_the_discount_down: 333 円の PCT10 が 299 円になる（期待 300 円）"]
            coverage_gaps: []
          metrics_fail: [tests_pass]
        correct:
          fixture: defect_passed
          class: goal
          memory: {failing_tests: [], coverage_gaps: []}
    # tests_insufficient の二つ目の代表で、テストの不備（要件に反する期待を持つテスト）を「## 未網羅」と記憶 coverage_gaps に
    # 書く（thin は不足の代表）。分布テストの分布（markov、divergent）には置かない（確率 0）ので、分布、設計値、基準は変えない。
    # 往復 10 で tests_defective の代表として足し、往復 11 で分割の取り消し（docs/review-findings.md の G）に合わせてこの形に
    # した。シナリオ unit_test_defective_self_rollback と、人がラベルを付ける材料の試しの実行（profiles の labeling）が写し、
    # test_metrics.py が指標を確かめる。REQ-2 の 0 円の下限に反して -200 円を期待するテストは、どちらの実装の系統でも落ちる
    defective:
      class: tests_insufficient
      memory:
        failing_tests: []
        coverage_gaps: ["repo/tests/test_discount.py の test_amount_code_subtracts_the_whole_amount: 小計 300 円に OFF500 で -200 円を期待しているが、REQ-2 は支払額が 0 円を下回らない（受け入れ基準は 0 円）。期待が要件に反するので、このテストは落ちる"]
      metrics_fail: [tests_pass]
    unknown: {class: unknown, memory: {failing_tests: [], coverage_gaps: []}}
  acceptance:
    ok: {class: goal, memory: {unmet_requirements: [], requirement_gaps: []}}
    unmet:
      class: requirement_unmet
      memory:
        unmet_requirements: ["REQ-1: 小計 333 円に PCT10 を適用すると支払額が 299 円になる（割引額の 1 円未満を切り捨てれば 300 円）。repo/src/shopcart/discount.py の Discount.apply が支払額を切り捨てている"]
        requirement_gaps: []
      metrics_fail: [verified_requirements]
    misread:
      class: requirement_misread
      memory:
        unmet_requirements: []
        requirement_gaps: [requirements.md にコードの大文字と小文字の扱いが無く、入力された pct10 を拒む]
    unknown:
      class: unknown
      memory: {unmet_requirements: [], requirement_gaps: []}
      metrics_fail: [verified_requirements]
  review:
    ok:
      class: goal
      memory: {review_findings: [（修正を要しない）parse_code の docstring にコードの形式の例があると読みやすい], design_issues: []}
    changes:
      class: changes_requested
      memory: {review_findings: [Cart.total が parse_code の ValueError をそのまま上げている], design_issues: []}
      metrics_fail: [blocking_findings]
    design_flaw:
      class: design_flaw
      memory: {review_findings: [], design_issues: [割引の種類を Discount の分岐で表しており、種類を足すたびに apply を直すことになる]}
      metrics_fail: [blocking_findings]
    unknown: {class: unknown, memory: {review_findings: [], design_issues: []}}
  release:
    ok: {class: goal, memory: {missing_notes: []}}
    incomplete:
      class: notes_incomplete
      memory: {missing_notes: [REQ-3]}
      metrics_fail: [changelog_covers_requirements]
    unknown:
      class: unknown
      memory: {missing_notes: []}
      metrics_fail: [changelog_covers_requirements, version_bumped]

profiles:
  # 各ステージのクラスの分布が (ステージ, 訪問) だけで決まる（release は carry の有無で、それは訪問の区分と一致する）。
  # goal の実装の二つの変種 ok と ok_b は同じ系統なので、単体テストのクラスの分布は実装の変種によらない。
  # 独立性検証は違反を出さず、マルコフ合成の予測は実測と一致するはず
  markov:
    intake:
      first: {ok: 0.97, unknown: 0.03}
      again: {ok: 0.98, unknown: 0.02}
    analyze:
      first: {ok: 0.72, unclear: 0.25, unknown: 0.03}
      again: {ok: 0.90, unclear: 0.08, unknown: 0.02}
    design:
      first: {ok: 0.85, gap: 0.12, unknown: 0.03}
      again: {ok: 0.95, gap: 0.03, unknown: 0.02}
    plan_tasks:
      first: {ok: 0.97, unknown: 0.03}
      again: {ok: 0.98, unknown: 0.02}
    implement:
      first: {ok: 0.36, ok_b: 0.36, lint: 0.08, scope: 0.07, broken: 0.05, unclear: 0.05, unknown: 0.03}
      again: {ok: 0.45, ok_b: 0.45, lint: 0.03, scope: 0.02, broken: 0.02, unclear: 0.01, unknown: 0.02}
    unit_test:
      first: {ok: 0.55, thin: 0.20, defect: 0.22, unknown: 0.03}
      again: {ok: 0.80, thin: 0.08, defect: 0.10, unknown: 0.02}
    acceptance:
      first: {ok: 0.82, unmet: 0.10, misread: 0.05, unknown: 0.03}
      again: {ok: 0.93, unmet: 0.04, misread: 0.01, unknown: 0.02}
    review:
      first: {ok: 0.78, changes: 0.14, design_flaw: 0.05, unknown: 0.03}
      again: {ok: 0.92, changes: 0.05, design_flaw: 0.01, unknown: 0.02}
    release:
      without_carry: {ok: 0.75, incomplete: 0.23, unknown: 0.02}
      with_carry: {ok: 0.97, incomplete: 0.02, unknown: 0.01}

  # markov と同じ分布で、goal の実装の二つ目の変種だけを ok_b（REQ-1 を誤る）から ok_fixed（正しい）に替える。
  # 単体テストの変種 defect は、ok の後では impl_defect、ok_fixed の後では goal になる（実在の pytest の結果も
  # そのとおり）。implement の goal というクラスの中で、下流（unit_test）の分布が代表によって分かれるので、
  # 独立性検証は stage:implement=goal で違反を検出するはず
  divergent:
    intake:
      first: {ok: 0.97, unknown: 0.03}
      again: {ok: 0.98, unknown: 0.02}
    analyze:
      first: {ok: 0.72, unclear: 0.25, unknown: 0.03}
      again: {ok: 0.90, unclear: 0.08, unknown: 0.02}
    design:
      first: {ok: 0.85, gap: 0.12, unknown: 0.03}
      again: {ok: 0.95, gap: 0.03, unknown: 0.02}
    plan_tasks:
      first: {ok: 0.97, unknown: 0.03}
      again: {ok: 0.98, unknown: 0.02}
    implement:
      first: {ok: 0.36, ok_fixed: 0.36, lint: 0.08, scope: 0.07, broken: 0.05, unclear: 0.05, unknown: 0.03}
      again: {ok: 0.45, ok_fixed: 0.45, lint: 0.03, scope: 0.02, broken: 0.02, unclear: 0.01, unknown: 0.02}
    unit_test:
      first: {ok: 0.55, thin: 0.20, defect: 0.22, unknown: 0.03}
      again: {ok: 0.80, thin: 0.08, defect: 0.10, unknown: 0.02}
    acceptance:
      first: {ok: 0.82, unmet: 0.10, misread: 0.05, unknown: 0.03}
      again: {ok: 0.93, unmet: 0.04, misread: 0.01, unknown: 0.02}
    review:
      first: {ok: 0.78, changes: 0.14, design_flaw: 0.05, unknown: 0.03}
      again: {ok: 0.92, changes: 0.05, design_flaw: 0.01, unknown: 0.02}
    release:
      without_carry: {ok: 0.75, incomplete: 0.23, unknown: 0.02}
      with_carry: {ok: 0.97, incomplete: 0.02, unknown: 0.01}

  # 人がラベルを付ける材料（docs/human-labeling.md）を作る試しの実行の分布（adopting.md 第15.1節。software_factory/labeling.py）。
  # 分布テスト、独立性検証、マルコフ合成には使わない。往復 10 で変えた代表と、それが届く上流の組み合わせ（三つのペルソナ、
  # goal の実装の三つの変種）を、少ない実行で踏むように訪問 1 の分布を寄せる。分布テストの分布に無い unit_test の defective
  # も置く。訪問 2 以降は goal に寄せて、実行を acceptance まで進める
  labeling:
    intake:
      first: {ok: 0.85, unknown: 0.15}
      again: {ok: 1.0}
    analyze:
      first: {ok: 0.5, unclear: 0.35, unknown: 0.15}
      again: {ok: 1.0}
    design:
      first: {ok: 0.6, gap: 0.25, unknown: 0.15}
      again: {ok: 1.0}
    plan_tasks:
      first: {ok: 1.0}
      again: {ok: 1.0}
    implement:
      first: {ok: 0.34, ok_b: 0.33, ok_fixed: 0.33}
      again: {ok: 0.34, ok_b: 0.33, ok_fixed: 0.33}
    unit_test:
      first: {ok: 0.5, defective: 0.5}
      again: {ok: 1.0}
    acceptance:
      first: {ok: 0.25, unmet: 0.25, misread: 0.25, unknown: 0.25}
      again: {ok: 1.0}
    review:
      first: {ok: 1.0}
      again: {ok: 1.0}
    release:
      without_carry: {ok: 1.0}
      with_carry: {ok: 1.0}
