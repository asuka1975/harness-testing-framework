# markov の本体に、assurance のゲートの分布を足した実行の基準。ゲートの答えは成果物によらず、実行の種で組み立てた
# RandomGateClassifier が bindings.gates の分布から引く（ほかのフェーズのゲートと、ステージの評価は印を読む分類器）。
# review の goal の成果物はどの変種も同じ（goal の時にも修正を要しない指摘を記憶 review_findings に書く）なので、ゲートが
# changes_requested を選ぶと、その指摘を持って implement に戻る。
#
# 基準は設計値の MarkovModel（software_factory/design.py の design_model に bindings.gates を足したもの）に synthesize を
# かけた厳密な値から導いた。中心は設計値、幅は既定の回数（400）での標準誤差の 3.2 倍以上をとり、0.01 の単位で
# 外側に丸めた。E[n] は evaluations の 400 倍、mean_visits の標準誤差は visits_variance から出した。
# test_stochastic.py の test_correct_expectations_follow_the_design が、各基準が設計値の両側に 3 SE 以上 5 SE 以下あることを
# 確かめる。往復 8 で plan_tasks の design_incomplete を設計値から外したので、導き直した。
# 種は基準を書く前に決めた。往復 10 で、SE の倍数の注記を四捨五入に揃えた（3.45 → 3.5、3.55 → 3.6）。値は変えていない。
# 四つのうち、ゲートを揺らす前後を見分けるのはゲートの二つの基準だけ。status_rate と mean_visits は、ゲートを揺らさない本体
# （完了 0.6942、implement の訪問の回数 1.673）でも通りうる（status_rate は 99%、mean_visits は 52% ほど）。ゲートの分布が
# 効いていることは、markov_gated_shifted.yaml のずらした基準がすべて落ちることでも確かめる。
expectations: software-factory-markov-gated
description: markov の確率的な偽ステージ本体と、実行ごとの種で揺らす assurance のゲートでの、ゲートの結果の出現率、実行の最後の状態、訪問の回数
workflow: ../../workflow.yaml
runs: 400
seed: 50000
bindings:
  profile: markov
  gates:
    assurance: {goal: 0.8, changes_requested: 0.2}
criteria:
  - kind: outcome_rate     # 設計値 0.20（review の訪問 1 の後のゲート）、E[n] 235.2、SE 0.0261。両側 3.5 SE
    scope: phase
    target: assurance
    visit: 1
    outcome: changes_requested
    min: 0.11
    max: 0.29
  - kind: outcome_rate     # 設計値 0.20（review の訪問 2 以降の後のゲート）、E[n] 107.1、SE 0.0387。両側 3.4 SE
    scope: phase
    target: assurance
    from_visit: 2
    outcome: changes_requested
    min: 0.07
    max: 0.33
  - kind: status_rate      # synthesize の厳密な値 0.6662、SE 0.0236。下側 3.2 SE、上側 3.6 SE
    status: completed
    min: 0.59
    max: 0.75
  - kind: mean_visits      # synthesize の厳密な値 1.887、訪問の回数の標準偏差 1.348（visits_variance）、SE 0.0674。下側 3.2 SE、上側 3.3 SE
    target: implement
    min: 1.67
    max: 2.11
