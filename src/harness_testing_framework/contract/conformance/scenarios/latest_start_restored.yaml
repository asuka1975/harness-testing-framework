scenario: latest_start_restored
description: s2 を二度訪れた後に s3 が e3_back で戻ると、s2 の直近の訪問（s2#2、m21 を持つ）の開始時を復元し、s3 の書いた m33 と out/x を捨て、p1 のゲートを未通過に戻す
workflow: ../workflows/basic.yaml
metrics: conformance
seed: 1
inputs: &id003
  in.txt: x
visits:
  s1#1:
    files:
      s1.txt: s1
      s1.flag: 'true'
    classify: &id001
      choice: goal
      confidence: 0.9
  s2#1:
    files:
      s2.txt: s2
      s2.flag: 'false'
      gate1.flag: 'true'
    memory:
      m21: fix
    classify:
      choice: e2_back
      confidence: 0.9
  s1#2:
    files:
      s1.txt: s1-v2
      s1.flag: 'true'
    classify: *id001
  s2#2: &id002
    files:
      s2.txt: s2
      s2.flag: 'true'
      gate1.flag: 'true'
    classify: *id001
  s3#1:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
      out/x: y
    memory:
      m32: gap
      m33: drop-me
    classify:
      choice: e3_back
      confidence: 0.9
  s2#3: *id002
  s3#2:
    files:
      s3.txt: s3
      s3.flag: 'true'
      gate2.num: '0'
    classify: *id001
gates:
  p1#2: *id001
  p1#3: *id001
  p2#2: *id001
expect:
  status: completed
  trace:
  - start s1#1
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#1
  - eval stage s2 = e2_back
  - rollback s2 -> s1 [e2_back 1]
  - start s1#2
  - eval stage s1 = goal
  - next s1 -> s2
  - start s2#2
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#1
  - eval stage s3 = e3_back
  - rollback s3 -> s2 [e3_back 1] crossing
  - start s2#3
  - eval stage s2 = goal
  - eval phase p1 = goal
  - gate_pass s2
  - next s2 -> s3
  - start s3#2
  - eval stage s3 = goal
  - eval phase p2 = goal
  - gate_pass s3
  - complete
  - end completed
  starts:
    s1#2:
      files: *id003
      memory:
        m21: fix
      gates: []
    s2#2:
      files:
        in.txt: x
        s1.txt: s1-v2
        s1.flag: 'true'
      memory:
        m21: fix
      gates: []
    s3#1:
      files:
        in.txt: x
        s1.txt: s1-v2
        s1.flag: 'true'
        s2.txt: s2
        s2.flag: 'true'
        gate1.flag: 'true'
      memory:
        m21: fix
      gates:
      - p1
    s2#3:
      files:
        in.txt: x
        s1.txt: s1-v2
        s1.flag: 'true'
      memory:
        m21: fix
        m32: gap
      gates: []
    s3#2:
      files:
        in.txt: x
        s1.txt: s1-v2
        s1.flag: 'true'
        s2.txt: s2
        s2.flag: 'true'
        gate1.flag: 'true'
      memory:
        m21: fix
        m32: gap
      gates:
      - p1
