# 説明: produce が自分自身へ戻る。carry の format_errors は produce の memory_out と memory_in の両方にある
workflow:
  name: retry-self
  description: 自分自身へのロールバック（carry を持ってそのステージをやり直す）の正例
  inputs:
  - request.md
  phases:
  - id: build
    name: Build
    description: 要求から成果物を作り、確かめる
    goal:
      qualitative: 要求を満たす成果物が確かめられている
      quantitative: {}
    stages:
    - id: produce
      name: Produce
      description: request.md を読み、output.txt を書く
      artifacts:
        reads:
        - request.md
        writes:
        - output.txt
        memory_in:
        - defects
        - format_errors
        memory_out:
        - format_errors
      goal:
        qualitative: output.txt が request.md の全項目を含む
        quantitative:
          output_exists:
            description: output.txt が存在する
            equals: true
      end_state:
      - id: format_broken
        description: output.txt の形式が壊れていて読めない。壊れた箇所が記憶 format_errors に列挙されている。
      - id: unknown
        description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
      rollback:
      - state: format_broken
        stage: produce
        carry:
        - format_errors
        max: 2
    - id: inspect
      name: Inspect
      description: output.txt を request.md と突き合わせ、結果を inspection.json に書く
      artifacts:
        reads:
        - request.md
        - output.txt
        writes:
        - inspection.json
        memory_in: []
        memory_out:
        - defects
      goal:
        qualitative: output.txt に要求との食い違いが無いことが inspection.json に記録されている
        quantitative:
          defect_count:
            description: inspection.json に記録された食い違いの数
            max: 0
      end_state:
      - id: defects_found
        description: 要求との食い違いが一つ以上 inspection.json に記録されている。
      - id: unknown
        description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
      rollback:
      - state: defects_found
        stage: produce
        carry:
        - defects
        max: 2
