# check: metric_range
# 説明: 指標の基準が有限の数でない（.nan）
workflow:
  name: minimal
  description: 一つのフェーズに二つのステージを持つ最小の正例。後のステージが前のステージへ carry を持って戻る
  inputs:
  - request.md
  phases:
  - id: build
    name: Build
    description: 要求から成果物を作り、確かめる
    goal:
      qualitative: 要求を満たす成果物が確かめられている
      quantitative: {}
    stages:
    - id: produce
      name: Produce
      description: request.md を読み、output.txt を書く
      artifacts:
        reads:
        - request.md
        writes:
        - output.txt
        memory_in:
        - defects
        memory_out: []
      goal:
        qualitative: output.txt が request.md の全項目を含む
        quantitative:
          output_exists:
            description: output.txt が存在する
            equals: true
      end_state:
      - id: unknown
        description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
      rollback: []
    - id: inspect
      name: Inspect
      description: output.txt を request.md と突き合わせ、結果を inspection.json に書く
      artifacts:
        reads:
        - request.md
        - output.txt
        writes:
        - inspection.json
        memory_in: []
        memory_out:
        - defects
      goal:
        qualitative: output.txt に要求との食い違いが無いことが inspection.json に記録されている
        quantitative:
          defect_count:
            description: inspection.json に記録された食い違いの数
            max: .nan
      end_state:
      - id: defects_found
        description: 要求との食い違いが一つ以上 inspection.json に記録されている。
      - id: unknown
        description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
      rollback:
      - state: defects_found
        stage: produce
        carry:
        - defects
        max: 2
